apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Pvramana1/observability-gitops-nm.git
    targetRevision: main
    path: apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
