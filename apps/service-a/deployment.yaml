apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: asia-south1-docker.pkg.dev/project-61ebbdbd-73fb-43b8-93a/observability-repo/service-a:1.0
          ports:
            - containerPort: 8080
