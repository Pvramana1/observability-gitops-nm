apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: asia-south1-docker.pkg.dev/project-61ebbdbd-73fb-43b8-93a/observability-repo/frontend:1.0
          ports:
            - containerPort: 8080
